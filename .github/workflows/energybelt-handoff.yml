name: Temporary EnergyBelt APK handoff

on:
  push:
    paths:
      - .github/workflows/energybelt-handoff.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch APK
        shell: bash
        env:
          APK_URL: 'https://release-assets.githubusercontent.com/github-production-release-asset/1380632673/5f865090-e27d-43f6-99af-9b261a5b0003?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MTM2MTY4MywibmJmIjoxNzkxMzU4MDgzLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.1j2tDP9_7PmeOIUomu8E7eYXnSRCUF7Ecl_dMhr7sGI&response-content-disposition=attachment%3B+filename%3DEnergyBelt-android-debug.apk&response-content-type=application%2Fvnd.android.package-archive&rscd=attachment%3B+filename%3DEnergyBelt-android-debug.apk&rsct=application%2Fvnd.android.package-archive&se=2026-10-07T08%3A15%3A45Z&sig=wqoNm%2BNNvL6HaPSl6BR6n%2BNYyc%2F5TsfHzOpwaftaSCc%3D&ske=2026-10-07T08%3A15%3A45Z&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sks=b&skt=2026-10-07T07%3A15%3A33Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2018-11-09&sp=r&spr=https&sr=b&sv=2018-11-09'
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors "$APK_URL" -o EnergyBelt.apk
          test "$(stat -c %s EnergyBelt.apk)" = "150278190"
      - name: Publish temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete energybelt-chat-handoff --yes 2>/dev/null || true
          gh release create energybelt-chat-handoff EnergyBelt.apk \
            --title "EnergyBelt APK handoff" \
            --notes "Temporary file handoff"
