name: EnergyBelt chat artifact handoff 3

on:
  push:
    paths:
      - .github/workflows/energybelt-chat-artifact3.yml

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch APK
        shell: bash
        env:
          APK_URL: 'https://release-assets.githubusercontent.com/github-production-release-asset/1380632673/19b65b50-bf5c-40f6-90ef-6e325582407b?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-10-07T09%3A11%3A35Z&rscd=attachment%3B+filename%3DEnergyBelt-android-debug.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-10-07T08%3A11%3A16Z&ske=2026-10-07T09%3A11%3A35Z&sks=b&skv=2018-11-09&sig=pOC3t%2BLtbM66HhVpp35uzRp6%2BTnOq7A%2FNiMYD3u7Yp8%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MTM2NDU2NywibmJmIjoxNzkxMzYwOTY3LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.1LJtORcEhB4aH00dE_MYx55iVResv59mnI9lkSy1h_Y&response-content-disposition=attachment%3B%20filename%3DEnergyBelt-android-debug.apk&response-content-type=application%2Fvnd.android.package-archive'
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors "$APK_URL" -o EnergyBelt.apk
          test "$(stat -c %s EnergyBelt.apk)" = "150278190"
      - uses: actions/upload-artifact@v4
        with:
          name: EnergyBelt-apk
          path: EnergyBelt.apk
          if-no-files-found: error
          retention-days: 1
